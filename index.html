<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parallax Journey</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <section class="balloons parallax">
    <div class="card">
      <h1>The Journey Begins</h1>
      <p>A girl starts her journey in a hot air balloon.</p>
    </div>
  </section>

  <section class="sunset parallax">
  <div class="card">
    <h1>Above the Clouds</h1>
    <p>The hot air balloon rises higher and drifts quietly through the sky.</p>
  </div>
</section>

  <section class="home parallax">
    <div class="card">
      <h1>Going Home</h1>
      <p>She returns home after a beautiful day.</p>
    </div>
  </section>

</body>

</html>
